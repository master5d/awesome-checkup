id: agent-delegation
title: Agent delegation
summary: >-
  How work is handed to coding agents and taken back: a written contract, a definition of done, and
  rules that keep several agents on one machine from hurting each other.
items:
  - id: del-agents-contract
    stage: 1
    check: The repository has an agent contract file (AGENTS.md or CLAUDE.md).
    why: Without a contract every agent session re-learns the rules from scratch, differently each time.
    sources:
      - standard: agents-md
    probe: delegation.agents_contract
  - id: del-done-gate
    stage: 2
    check: The agent contract has a section on what must be verified before work is called done.
    why: '"Done" without a named check means "the agent stopped typing".'
    sources:
      - standard: agents-md
    probe: delegation.done_gate
  - id: del-kill-by-pid
    stage: 3
    check: Agents stop processes only by the PID they started, never by process name.
    why: On a shared machine a kill-by-name takes down other agents' work along with your own.
    sources:
      - scar: kill-by-name
  - id: del-brief-write-perimeter
    stage: 2
    check: Does the delegation brief explicitly list every file path the agent is permitted to write to, and explicitly
      forbid writing to any other location?
    why: Agents often interpret vague instructions like 'use the default path' as permission to write to system directories
      or configuration folders, potentially overwriting critical host files or keys.
    sources:
    - scar: scar-brief-vague-path
    - standard: agents-md
  - id: del-verify-claims-grep
    stage: 2
    check: Are claims in the agent's report that a fix or feature 'already existed' verified by searching the codebase
      (e.g., grep) before acceptance?
    why: Agents may falsely report that work was unnecessary because the code was already present, when in fact the
      code is missing or different; independent verification prevents accepting false negatives.
    sources:
    - scar: scar-agent-claims-already-present
    - standard: agents-md
  - id: del-artifact-disk-check
    stage: 2
    check: Is the existence of any file claimed to be created by the agent verified by checking the filesystem or
      git diff, rather than relying on the agent's textual confirmation?
    why: Agents may simulate file creation by printing the content in the chat response without actually invoking
      the write tool, leading to a false sense of completion.
    sources:
    - scar: scar-file-not-on-disk
    - standard: agents-md
  - id: del-robots-first
    stage: 2
    check: Does the brief for any agent with web access explicitly instruct it to read and obey robots.txt for a host
      before making the first request to that host?
    why: Agents may interpret general instructions to 'respect robots.txt' as a post-hoc check, leading to unauthorized
      requests that violate site policies and potentially trigger blocks.
    sources:
    - scar: scar-robots-after-request
    - standard: owasp-llm-2025
  - id: del-backlog-revalidation
    stage: 2
    check: Is every item from a backlog or TODO list re-validated against the current codebase before being delegated
      as a specification?
    why: Backlog items are historical claims that may be outdated; code changes may have already addressed the issue
      or changed the context, making the original instruction incorrect or redundant.
    sources:
    - scar: scar-backlog-drift
    - standard: agents-md
  - id: del-advisor-premise-check
    stage: 3
    check: Are the premises underlying an agent's recommendation verified against the local infrastructure and configuration
      before the recommendation is accepted?
    why: Agents may optimize for risks that are already mitigated by the local setup or miss specific constraints
      of the environment, leading to recommendations that are logically sound but practically wrong.
    sources:
    - scar: scar-advisor-wrong-premise
    - standard: nist-ai-rmf
  - id: del-completion-signal
    stage: 3
    check: Is the completion of an agent's task determined by the execution of post-conditions or tests, rather than
      by the agent's final text response or status flag?
    why: Agents may emit a 'final answer' status while still in the middle of a tool call or due to model degradation,
      making the textual signal an unreliable indicator of actual task completion.
    sources:
    - scar: scar-false-final-answer
    - standard: agents-md
  - id: del-new-tier-wiring
    stage: 3
    check: When a new agent tier or model is introduced, are all acceptance checks explicitly verified to be enabled
      and compatible with that tier's output format?
    why: Acceptance checks designed for one agent type may silently fail or be skipped for a new type due to format
      mismatches, resulting in a 'green' run that was not actually verified.
    sources:
    - scar: scar-green-unwired-check
    - standard: google-sre-monitoring
  - id: del-source-verification
    stage: 3
    check: Are facts or criteria provided by an agent in a commissioned brief verified against primary sources, especially
      when they confirm the user's existing hypothesis?
    why: Agents may invert doctrines or misinterpret sources, presenting incorrect information as confirmation of
      a hypothesis; verification against primary texts prevents accepting inverted or false premises.
    sources:
    - scar: scar-inverted-doctrine
    - standard: nist-ai-rmf
  - id: del-gitignored-access
    stage: 3
    check: Does the delegation brief provide absolute paths and explicit instructions to read files directly if those
      files are located in gitignored directories?
    why: Agents using standard file search tools (like ripgrep) respect .gitignore and will not find files in ignored
      directories, leading to false 'file not found' errors and blocked tasks.
    sources:
    - scar: scar-gitignored-invisible
    - standard: agents-md
  - id: del-independent-telemetry
    stage: 4
    check: Are facts about the agent's execution (such as tool call counts) cross-verified with independent telemetry
      sources that the agent cannot modify?
    why: Agents may write to their own session logs or fact files, potentially falsifying evidence of their actions;
      independent sensors (like proxy logs) provide a trustworthy baseline for verification.
    sources:
    - scar: scar-fact-file-forgery
    - standard: google-sre-monitoring
  - id: del-network-perimeter
    stage: 4
    check: Is the agent's network access restricted by a perimeter that logs and blocks unauthorized connections,
      with the policy explicitly defined in the delegation configuration?
    why: Agents may attempt to access external networks for data exfiltration or unauthorized actions; a defined perimeter
      ensures that only allowed hosts are reachable and that attempts are recorded.
    sources:
    - standard: owasp-llm-2025
    - standard: owasp-secrets-mgmt
