id: gateway
title: LLM gateway & routing
summary: >-
  One door between your code and every model provider: keys, quotas, fallbacks and data policy live
  in one config instead of in every script. Config conventions the auto-checks understand — a LiteLLM
  YAML with model_list:, a pool is public-only when its name contains "public" or its members set
  model_info.data_policy.public_only, and each endpoint declares model_info.data_policy.trains: yes | no | unknown.
items:
  - id: gw-env-keys
    stage: 1
    check: Provider API keys in the gateway config come from the environment, never as literals.
    why: A key written into a config file ends up in git history and every backup of the repo.
    sources:
      - standard: owasp-secrets-mgmt
    probe: gateway.litellm.env_keys
  - id: gw-single-door
    stage: 2
    check: Application code, scripts and agents call models only through the gateway; no provider SDK keys live in application code.
    why: Quotas, fallbacks and data policy only hold if nothing goes around them.
    sources:
      - standard: owasp-llm-2025
  - id: gw-no-fallback-into-public
    stage: 2
    check: No fallback chain — direct or transitive — leads from a general pool into a public-only pool.
    why: Fallbacks are recursive; one convenient edge sends private prompts to an endpoint meant only for public text.
    sources:
      - scar: free-endpoint-trains-silently
      - standard: owasp-llm-2025
    probe: gateway.litellm.no_fallback_into_public
  - id: gw-data-policy-per-member
    stage: 3
    check: Every endpoint behind the gateway declares its data policy, and endpoints that train on inputs — or whose policy is unknown — are reachable only from a public-only pool.
    why: A policy accepted as "not published" is a policy nobody re-checks once the provider publishes "trains on prompts".
    sources:
      - scar: free-endpoint-trains-silently
      - standard: owasp-llm-2025
    probe: gateway.litellm.data_policy
  - id: gw-fallback-timeout-tuned
    stage: 3
    check: Does every fallback chain in the gateway config declare a per-deployment timeout that is explicitly tuned
      against real workload latency rather than a generic health-check value?
    why: A silent or busy backend does not return an error; without a short, workload-specific timeout, the router
      waits for the global limit, rendering the fallback chain ineffective and causing client-side timeouts.
    sources:
    - scar: scar-fallback-theater
    - standard: google-sre-monitoring
  - id: gw-judge-pinned-model
    stage: 3
    check: Are endpoints designated for LLM-as-a-judge or measurement tasks pinned to a single specific model instance
      rather than a load-balanced pool alias?
    why: Using a pool for a judge introduces variance in the measurement instrument itself, making results across
      runs incomparable and masking true model performance differences.
    sources:
    - scar: scar-judge-pool-variance
    - standard: nist-ai-rmf
  - id: gw-identity-fallback-closed
    stage: 3
    check: Do fallback configurations for credentials or identities fail closed (returning an error) rather than substituting
      a different valid identity or token?
    why: Substituting a different identity during a fallback is impersonation, not resilience; it results in actions
      being performed under the wrong name, which is an irreversible security and compliance failure.
    sources:
    - scar: scar-identity-impersonation
    - standard: owasp-llm-2025
  - id: gw-usage-attribution-verified
    stage: 4
    check: Do reports or metrics attributed to a specific pool or model include verification from usage logs confirming
      which specific backend members actually served the requests?
    why: Pool labels in reports can be misleading if some members are down or rate-limited; verifying actual attribution
      prevents drawing architectural conclusions from single-model data labeled as ensemble data.
    sources:
    - scar: scar-pool-label-misleading
    - standard: google-sre-monitoring
  - id: gw-error-classification-post-throttle
    stage: 3
    check: Are error classifications and root-cause analyses deferred until after throttling (429) conditions have
      been resolved and requests re-attempted?
    why: Throttling errors mask the underlying cause; diagnosing failures while rate limits are active leads to incorrect
      conclusions about permanent issues versus temporary capacity constraints.
    sources:
    - scar: scar-throttling-masks-error
    - standard: google-sre-monitoring
  - id: gw-unknown-data-not-zero
    stage: 3
    check: Do gateway metrics and dashboards distinguish between a measured zero and a missing data source, avoiding
      the substitution of null or missing values with zero?
    why: Displaying missing data as zero creates a false sense of security or success; it hides configuration errors
      or dead sources that require attention.
    sources:
    - scar: scar-unknown-as-zero
    - standard: nist-ai-rmf
  - id: gw-config-generated-from-recipes
    stage: 2
    check: Is the final gateway configuration file generated from a source-of-truth recipe system, with manual edits
      to the generated file blocked by tests?
    why: Manual edits to generated configs lead to drift and silent failures; enforcing generation ensures that all
      changes are reviewed, documented, and consistent with the intended architecture.
    sources:
    - standard: openssf-scorecard
  - id: gw-key-distribution-verified
    stage: 2
    check: Is the distribution of gateway API keys to consumers verified by checking that the environment variables
      are correctly loaded in the specific shell contexts used by the services?
    why: Keys may be present in files but not exported to the process environment due to shell profile differences
      (e.g., zsh vs bash), leading to silent authentication failures that are hard to diagnose.
    sources:
    - scar: scar-key-env-mismatch
    - standard: owasp-secrets-mgmt
  - id: gw-scar-class-not-transport
    stage: 4
    check: Are known defects or 'scars' documented as properties of the model class or API behavior rather than specific
      to a single transport or gateway path?
    why: Defects like token budget exhaustion in reasoning models can manifest across multiple transports; scoping
      them to one path prevents detection in other code paths that use the same model class.
    sources:
    - scar: scar-scar-transport-scoped
    - standard: nist-ai-rmf
  - id: gw-fallback-test-under-load
    stage: 3
    check: Are fallback chains tested under conditions where the primary backend is busy or slow, rather than just
      when it is completely down?
    why: A down backend fails fast, making fallbacks appear healthy; a busy backend holds connections, testing the
      actual timeout and failover logic that matters in production.
    sources:
    - standard: google-sre-monitoring
