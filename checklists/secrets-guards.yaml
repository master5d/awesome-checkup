id: secrets-guards
title: Secrets & guards
summary: >-
  Keys stay out of git and out of logs, and every guard that protects them states what it does when
  it cannot check.
items:
  - id: sec-env-ignored
    stage: 1
    check: .env files are ignored by git, and no later rule re-includes them.
    why: The first leak is almost always a .env committed with everything else.
    sources:
      - standard: owasp-secrets-mgmt
    probe: secrets.gitignore_env
  - id: sec-no-tracked-env
    stage: 1
    check: No .env file is tracked by git (templates like .env.example are fine).
    why: An ignore rule added after the first commit does not untrack the file.
    sources:
      - standard: owasp-secrets-mgmt
    probe: secrets.no_tracked_env
  - id: sec-scanner-wired
    stage: 2
    check: A secret scanner runs before commits or in CI.
    why: Rules in a contract are read by agents sometimes; a scanner reads every commit.
    sources:
      - standard: owasp-secrets-mgmt
    probe: secrets.scanner_wired
  - id: sec-guard-fail-policy
    stage: 3
    check: Every guard declares its failure policy — fail closed on irreversible channels, fail open but loudly when advisory, never silently.
    why: Undeclared policies are accidents of each guard's first version, and "checked, clean" looks the same as "could not check".
    sources:
      - scar: guards-with-seven-policies
      - standard: nist-ai-rmf
  - id: sec-verify-independent-path
    stage: 3
    check: Does the verification step for secret writes construct the target path independently of the write operation's
      logic?
    why: If verification uses the same resolution logic as the write, it will confirm errors in path resolution (e.g.,
      writing to the wrong user's home directory) as successful matches. Independent construction ensures the check
      validates the actual location, not just the intended one.
    sources:
    - scar: scar-verify-shared-resolution
    - standard: owasp-secrets-mgmt
  - id: sec-hash-single-extractor
    stage: 3
    check: Is a single, shared extraction and normalization function used for all sides when comparing secret hashes?
    why: Using different extraction methods (e.g., YAML parsing vs. raw string reading) can introduce invisible differences
      like whitespace or quotes, leading to false 'mismatch' conclusions that corrupt the mental model of which secrets
      are actually in use.
    sources:
    - scar: scar-hash-extractor-mismatch
    - standard: owasp-secrets-mgmt
  - id: sec-guard-consumer-parser
    stage: 3
    check: Are sanitization or guard rules defined by the logic of the consuming parser rather than a generic format
      specification?
    why: Defining 'dangerous' content based on a spec rather than the actual consumer's parser can leave gaps where
      the consumer interprets benign-looking input as dangerous, or where the sanitizer inadvertently creates dangerous
      structures from safe ones.
    sources:
    - scar: scar-sanitizer-spec-gap
    - standard: owasp-llm-2025
  - id: sec-guard-usage-verified
    stage: 4
    check: Is there a check that confirms the guard or security feature is actually being invoked in the production
      flow, not just present in the codebase?
    why: A guard that is implemented but not wired into the execution path provides false security. Verifying usage
      ensures that the protection mechanism is active and intercepting the intended events.
    sources:
    - scar: scar-shipped-not-used
    - standard: openssf-scorecard
  - id: sec-empty-window-null
    stage: 3
    check: Do monitoring aggregates return null or an explicit 'insufficient data' state when the observation window
      is empty, rather than zero?
    why: Aggregates like variance or mean calculated over an empty set often default to zero, which reads as 'stable'
      or 'calm' to consumers. This creates a false sense of security by masking the lack of data as a positive signal.
    sources:
    - scar: scar-empty-window-calm
    - standard: google-sre-monitoring
  - id: sec-import-isolation-test
    stage: 3
    check: Are import statements for cross-module dependencies tested in an isolated process that mimics the production
      runtime environment?
    why: Test runners often modify the system path (e.g., via conftest) to make imports work, hiding failures that
      would occur in the actual daemon or service context where those paths are not available. Isolated testing ensures
      the module can load itself.
    sources:
    - scar: scar-conftest-hides-import
    - standard: openssf-scorecard
  - id: sec-typecheck-gate
    stage: 2
    check: Is a type-checking step (e.g., tsc --noEmit) integrated into the daily test or build pipeline, not just
      the deployment stage?
    why: Test runners often transpile code without type-checking, allowing type errors to persist unnoticed for long
      periods. Integrating type checks into the frequent test cycle ensures that 'green tests' actually imply a healthy,
      compilable codebase.
    sources:
    - scar: scar-test-runner-no-typecheck
    - standard: openssf-scorecard
  - id: sec-fixture-live-data-filter
    stage: 3
    check: Do test fixtures that copy live append-only logs filter out entries that the test itself generates or modifies?
    why: Using a live log as a fixture base without filtering can cause tests to fail on the first real production
      entry if the test writes duplicate IDs or states. This breaks the test exactly when the system starts working
      correctly.
    sources:
    - scar: scar-fixture-live-log
    - standard: openssf-scorecard
  - id: sec-evidence-gap-first
    stage: 3
    check: Before escalating a discrepancy between automated evaluators to a human, is there a process to verify that
      all required evidence was available to both evaluators?
    why: Disputes between judges or evaluators are often caused by missing data or inconsistent rules rather than
      genuine ambiguity. Resolving evidence gaps first prevents wasting human attention on fixable technical issues.
    sources:
    - scar: scar-judge-evidence-gap
    - standard: nist-ai-rmf
  - id: sec-prompt-field-collision
    stage: 3
    check: Do prompt templates avoid using attribute names in the context that are identical to the expected answer
      field names?
    why: LLMs may copy values from context attributes that share the same name as the required output field, leading
      to parsing errors or incorrect data. Distinct naming prevents the model from confusing source data with the
      target structure.
    sources:
    - scar: scar-prompt-label-collision
    - standard: owasp-llm-2025
